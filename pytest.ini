[pytest]
testpaths = tests
addopts = -v --tb=short --strict-markers -W ignore::DeprecationWarning
markers =
    perf: performance benchmark tests (run with --benchmark-only to isolate)
    slow: tests over 5s
    integration: end-to-end tests that touch real devices/files
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
